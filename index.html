                      </Field>
                      <Field label="対象: ここまで">
                        <select value={rules.repechage.to} onChange={(e) => { const t = Number(e.target.value); setRule({ repechage: { ...rules.repechage, to: t, from: Math.min(t, rules.repechage.from) } }); }} className={INPUT_CLS}>
                          {repRoundOptions.map(r => <option key={r} value={r}>{roundName(r, numRounds)}</option>)}
                        </select>
                      </Field>
                    </div>
                    <p className="text-[10px] text-slate-500">ヘッダーの「敗者復活戦」タブから対戦表を作成して進行します。</p>
                  </>)}
                </Section>
              </>)}

              {settingsTab === 'players' && (<>
                <Field label="選手名を一括入力 (1行に1人 / 3〜32人)">
                  <textarea value={bulkText} onChange={(e) => setBulkText(e.target.value)} rows={5} placeholder={'Steve\nAlex\nCreeper\n...'} className={INPUT_CLS + ' font-mono text-xs'} />
                  <button onClick={handleBulkNames} className="mt-1 w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs py-1.5 cursor-pointer">この名前で人数と選手を反映 (トーナメントは再生成)</button>
                </Field>
                <div>
                  <h4 className="text-xs font-bold text-slate-400 mb-3 uppercase tracking-wide">選手名とアイコン編集</h4>
                  <div className="space-y-2.5">
                    {entryPlayers.map((p, i) => (
                      <div key={p.id} className="flex gap-2 items-center">
                        <span className="text-xs text-slate-500 w-5 font-mono">{String(i + 1).padStart(2, '0')}</span>
                        <div className="flex gap-1 items-center">
                          <select
                            value={isImg(p.flag) && !COUNTRY_FLAGS.some(c => c.flag === p.flag) ? 'custom' : p.flag}
                            onChange={(e) => handlePlayerUpdate(p.id, p.name, e.target.value)}
                            className="bg-slate-900 border border-slate-800 rounded px-1 py-1 text-xs w-20 text-center focus:outline-none focus:border-rose-500 cursor-pointer"
                          >
                            {COUNTRY_FLAGS.map(c => (
                              <option key={c.flag} value={c.flag}>{isImg(c.flag) ? `🖼️ ${c.name}` : `${c.flag} ${c.name}`}</option>
                            ))}
                            {!COUNTRY_FLAGS.some(c => c.flag === p.flag) && <option value={p.flag}>{isImg(p.flag) ? '📁 個別画像' : p.flag}</option>}
                          </select>
                          <label className="cursor-pointer bg-slate-800 hover:bg-slate-700 text-white rounded px-2 py-1 text-xs border border-slate-700 flex items-center justify-center">
                            📁
                            <input type="file" accept="image/*" className="hidden"
                              onChange={(e) => {
                                const file = e.target.files[0];
                                if (file) { const reader = new FileReader(); reader.onload = (ev) => handlePlayerUpdate(p.id, p.name, ev.target.result); reader.readAsDataURL(file); }
                              }} />
                          </label>
                        </div>
                        <input type="text" value={p.name} onChange={(e) => handlePlayerUpdate(p.id, e.target.value, p.flag)}
                          className="bg-slate-900 border border-slate-800 rounded px-2 py-1 text-xs w-full focus:outline-none focus:border-rose-500" />
                      </div>
                    ))}
                  </div>
                </div>
              </>)}

              {settingsTab === 'live' && (<>
                <Section title="🌐 公開・観戦 (リアルタイム)">
                  {!SERVER && (
                    <p className="text-[11px] text-slate-400 leading-relaxed">いまは<b>ローカルモード</b>です(同期サーバー未接続)。他の人に見せるには、フォルダで <code className="bg-slate-800 px-1">node server.js</code> を起動し、表示されたURLからこのサイトを開き直してください。観戦者は閲覧専用、あなただけが編集できます。</p>
                  )}
                  {SERVER && ADMIN && (<>
                    <p className="text-[11px] text-emerald-300 leading-relaxed">✅ 管理者としてログイン中。ここで入力した勝敗・設定は、観戦者の画面へリアルタイムに反映されます。観戦者は閲覧専用で、設定や勝敗は変更できません。</p>
                    <div className={`text-[11px] ${syncState === 'ok' ? 'text-emerald-400' : 'text-red-400'}`}>
                      {syncState === 'ok' ? '● 同期OK' : syncState === 'auth' ? '⚠ ログインが無効です。再ログインしてください' : '⚠ サーバーに送信できません (再試行中)'}
                    </div>
                    <Field label="観戦者に配るURL (閲覧専用)">
                      <input readOnly value={location.href.split('#')[0].split('?')[0]} onFocus={(e) => e.target.select()} className={INPUT_CLS + ' font-mono text-[11px]'} />
                    </Field>
                    <button onClick={async () => { try { await navigator.clipboard.writeText(location.href.split('#')[0].split('?')[0]); } catch (e) {} setCopied(true); setTimeout(() => setCopied(false), 1800); }}
                      className="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black py-2 cursor-pointer">{copied ? '✔ コピーしました' : '観戦URLをコピー'}</button>
                    <button onClick={() => { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} location.reload(); }}
                      className="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs py-2 cursor-pointer">ログアウト (閲覧モードで見る)</button>
                  </>)}
                </Section>
                <Section title="📺 配信専用画面">
                  <p className="text-[11px] text-slate-400 leading-relaxed">ボタン・設定を隠した「映すだけ」の画面を別ウィンドウで開きます。操作画面での勝者入力・順位表の表示は、リアルタイムで反映されます。勝ち上がりごとに速報バナー、優勝時に紙吹雪が出ます。サーバー接続時は、別のPC・OBSのブラウザソースでも連動します。</p>
                  <Field label="背景">
                    <select value={liveBg} onChange={(e) => setLiveBg(e.target.value)} className={INPUT_CLS}>
                      <option value="theme">テーマの背景をそのまま使う</option>
                      <option value="transparent">透過 (OBSのブラウザソース向け)</option>
                      <option value="green">グリーンバック (クロマキー用 #00FF00)</option>
                    </select>
                  </Field>
                  <label className="flex items-center gap-2 text-sm cursor-pointer">
                    <input type="checkbox" checked={liveTitle} onChange={(e) => setLiveTitle(e.target.checked)} />
                    大会名を上部に表示する
                  </label>
                  <Field label="配信画面のURL">
                    <input id="live-url" readOnly value={displayUrl} onFocus={(e) => e.target.select()} className={INPUT_CLS + ' font-mono text-[11px]'} />
                  </Field>
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={handleOpenDisplay} className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black py-2 cursor-pointer">別ウィンドウで開く</button>
                    <button onClick={handleCopyUrl} className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs py-2 cursor-pointer">{copied ? '✔ コピーしました' : 'URLをコピー'}</button>
                  </div>
                </Section>
                <Section title="連動の設定">
                  <label className="flex items-start gap-2 text-sm cursor-pointer">
                    <input type="checkbox" className="mt-1" checked={liveMirror} onChange={(e) => setLiveMirror(e.target.checked)} />
                    <span>順位表・敗者復活戦タブの開閉を配信画面にも反映する<br /><span className="text-[10px] text-slate-500">オフにすると、手元で順位表を確認しても配信には映りません。</span></span>
                  </label>
                </Section>
                <Section title="OBSでの使い方">
                  <ol className="text-[11px] text-slate-400 leading-relaxed list-decimal pl-4 space-y-1">
                    <li>「別ウィンドウで開く」で配信画面を開き、OBS の <b>ウィンドウキャプチャ</b> で取り込む (背景は「グリーンバック」+ クロマキーが簡単)。</li>
                    <li>OBS の <b>ブラウザソース</b> にURLを貼る場合、<b>サーバー接続時(node server.js)</b>はどのPCでも連動します。サーバーなしのローカルモードでは、操作画面と同じブラウザ内でのみ連動します。</li>
                    <li>うまく連動しないときは、配信画面を開き直してください。</li>
                  </ol>
                </Section>
              </>)}

              {settingsTab === 'data' && (<>
                <Field label="バックアップ (JSONファイル)">
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={handleExport} className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs py-2 cursor-pointer">⬇ 書き出し</button>
                    <label className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs py-2 cursor-pointer text-center">
                      ⬆ 読み込み
                      <input type="file" accept="application/json,.json" className="hidden" onChange={(e) => { handleImport(e.target.files[0]); e.target.value = ''; }} />
                    </label>
                  </div>
                  <p className="text-[10px] text-slate-500 mt-2">進行状況・選手・ルール・復活戦をまるごと保存できます。このブラウザには自動保存もされています (画像を多数入れると容量超過で自動保存できない場合があります)。</p>
                </Field>
                <Field label="全データ初期化">
                  <button onClick={async () => { if (window.confirm('自動保存データを消して初期状態に戻します。' + (ADMIN ? '観戦者の画面からも大会が消えます。' : '') + 'よろしいですか?')) { try { localStorage.removeItem(STORAGE_KEY); } catch (e) {} if (ADMIN) { try { await fetch('api/state', { method: 'DELETE', headers: authHeaders() }); } catch (e) {} } location.reload(); } }}
                    className="w-full bg-slate-800 hover:bg-red-900 border border-slate-700 text-xs py-2 cursor-pointer">自動保存を消して最初から</button>
                </Field>
              </>)}
            </div>

            <div className="space-y-2 mt-4 pt-4 border-t border-slate-800 shrink-0">
              <button
                onClick={() => { setRepechage(null); setPlayoffs([]); setPlayerHp({}); initializeTournament(playerCount); }}
                className="w-full bg-rose-600 hover:bg-rose-500 py-2.5 rounded-lg text-sm font-bold shadow-lg shadow-rose-600/20 transition flex items-center justify-center gap-2 cursor-pointer"
              >
                <RotateCcwIcon />
                トーナメントをリセット
              </button>
              <button
                onClick={() => { setRepechage(null); setPlayoffs([]); handleShuffle(); }}
                className="w-full bg-slate-800 hover:bg-slate-700 py-2.5 rounded-lg text-sm font-semibold border border-slate-700 transition flex items-center justify-center gap-2 cursor-pointer"
              >
                <ShuffleIcon />
                選手をシャッフル
              </button>
            </div>
          </div>

          {view === 'rep' && rules.repechage.enabled && (
            <RepBoard rep={repechage} derived={repDerived} pmap={pmap} eligibleIds={repEligible.map(p => p.id)} stale={repStale}
              rules={rules} totalRounds={numRounds} onGenerate={handleRepGenerate} onPick={handleRepPick} onUndo={handleRepUndo} />
          )}

          {/* メインボードエリア */}
          <main ref={mainRef} className={`relative flex-1 min-h-0 flex items-center justify-center overflow-hidden p-2 ${view === 'rep' && rules.repechage.enabled ? 'hidden' : ''}`}>
            <div className="relative shrink-0" style={{ width: `${baseW * boardScale}px`, height: `${baseH * boardScale}px` }}>
            <div
              ref={boardRef}
              className="absolute left-0 top-0 select-none"
              style={{
                width: `${baseW}px`,
                height: `${baseH}px`,
                transform: `scale(${boardScale})`,
                transformOrigin: 'top left',
              }}
            >
              {/* 道路 (接続線) */}
              {renderRoads()}

              {/* 優勝スロット枠 */}
              {!championPlayer && (
                <div
                  className="absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center z-10"
                  style={{ left: `${championCoords.x}px`, top: `${championCoords.y}px` }}
                >
                  <div className="flex flex-col items-center justify-center w-24 h-9 border border-dashed border-white/20 bg-slate-900/40 rounded-lg text-white/50 text-[9px] font-black uppercase tracking-widest backdrop-blur-sm shadow-inner">
                    🏆 CHAMP
                  </div>
                </div>
              )}

              {/* 各試合コントロールパネル (WIN/VS/やり直し) */}
              {matches.map((round, rIndex) => (
                <div key={`round-ctrl-${rIndex}`}>
                  {round.map((match, mIndex) => {
                    const coords = getMatchCenterCoordinates(rIndex, mIndex);
                    
                    if (match.isLocked) {
                      return null;
                    }

                    // すでに勝者が決まっている場合：うっすらやり直し（Undo）ボタンを表示
                    const hasBye = match.player1Id?.startsWith('bye-') || match.player2Id?.startsWith('bye-');

                    if (match.winnerId) {
                      if (hasBye) return null; // 不戦勝の試合はやり直しボタンを非表示
                      return !isPreviewMode && (
                        <div
                          key={`panel-undo-${match.id}`}
                          className="absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center z-20 pointer-events-auto opacity-40 hover:opacity-100 transition-opacity duration-300"
                          style={{ left: `${coords.x}px`, top: `${coords.y}px` }}
                        >
                          <button
                            onClick={() => handleUndoWinner(rIndex, mIndex)}
                            className="bg-slate-950/90 hover:bg-slate-900 border border-slate-700/80 hover:border-slate-500 text-slate-300 hover:text-white rounded-lg px-2.5 py-1 shadow-2xl transition flex items-center justify-center gap-1.5 cursor-pointer text-[10px] font-black"
                            title="勝者の決定を取り消す"
                          >
                            <RotateCcwIcon className="w-3.5 h-3.5" />
                            <span>やり直し</span>
                          </button>
                        </div>
                      );
                    }

                    // まだ勝者が決まっていない場合：WIN/VSボタンを表示
                    return !isPreviewMode && (
                      <div
                        key={`panel-${match.id}`}
                        className="absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center z-20 pointer-events-auto"
                        style={{ left: `${coords.x}px`, top: `${coords.y}px` }}
                      >
                        <div 
                          style={{ width: `${uiConfig.panelW}px` }}
                          className={`bg-slate-950/95 border border-slate-700/80 backdrop-blur-md px-2 py-1 rounded-xl flex items-center justify-between gap-1 shadow-2xl ${uiConfig.panelH}`}
                        >
                          {/* Player 1 WIN ボタン */}
                          <button
                            onClick={() => handleSetWinner(rIndex, mIndex, 'player1')}
                            className={`bg-rose-600 hover:bg-rose-500 rounded-lg text-white font-black transition flex items-center justify-center cursor-pointer shadow-md shadow-rose-600/30 w-[42%] ${uiConfig.btnText}`}
                          >
                            {uiConfig.btnLabel || 'WIN'}
                          </button>

                          <span className={uiConfig.vsText}>VS</span>

                          {/* Player 2 WIN ボタン */}
                          <button
                            onClick={() => handleSetWinner(rIndex, mIndex, 'player2')}
                            className={`bg-blue-600 hover:bg-blue-500 rounded-lg text-white font-black transition flex items-center justify-center cursor-pointer shadow-md shadow-blue-600/30 w-[42%] ${uiConfig.btnText}`}
                          >
                            {uiConfig.btnLabel || 'WIN'}
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              ))}

              {/* プレイヤーピン (敗退していないプレイヤーならどのラウンドのピンであってもダブルクリックで編集可能) */}
              {players.map((player) => {
                if (player.isBye) return null; // 完全に見えなくする

                const pCoords = getPlayerCoords(player);
                const pinX = pCoords.x - uiConfig.pinSize / 2;
                const pinY = pCoords.y - (uiConfig.pinSize + uiConfig.needleHeight);

                const isChamp = player.position.round === numRounds;

                return (
                  <div
                    key={player.id}
                    style={{
                      position: 'absolute',
                      left: 0,
                      top: 0,
                      transform: `translate(${pinX}px, ${pinY}px) scale(${isChamp ? 1.25 : 1})`,
                      transition: 'transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease',
                      zIndex: isChamp ? 100 : player.isLoser ? 15 : 30,
                      opacity: player.isLoser ? 0.75 : 1,
                    }}
                    className="pointer-events-auto"
                  >
                    <MapPin
                      player={player}
                      isEditable={!player.isLoser}
                      onPlayerUpdate={handlePlayerUpdate}
                      isGold={isChamp}
                      uiConfig={uiConfig}
                      isPreviewMode={isPreviewMode}
                    />
                    {/* 敗退選手のHP入力欄 */}
                    {!isPreviewMode && player.isLoser && rules.hpMode !== 'ignore' && (
                      <div
                        style={{ width: `${uiConfig.pinSize + 20}px` }}
                        className="flex flex-col items-center mt-1 pointer-events-auto"
                      >
                        <div className="flex items-center gap-1 bg-slate-900/90 border border-slate-700/70 rounded-lg px-1.5 py-0.5 shadow-lg">
                          {bgTheme === 'minecraft' ? <img src="mc/heart.svg" alt="" className="w-3 h-auto" style={{ imageRendering: 'pixelated' }} /> : <span className="text-red-400 text-[10px] font-black leading-none select-none">❤️</span>}
                          <input
                            type="number"
                            
                            max="9999"
                            placeholder={rules.hpLabel}
                            value={playerHp[player.id] ?? ''}
                            onChange={(e) => handleSetHp(player.id, e.target.value)}
                            onClick={(e) => e.stopPropagation()}
                            onDoubleClick={(e) => e.stopPropagation()}
                            className="bg-transparent text-center text-white font-black focus:outline-none w-14 text-[10px] placeholder-slate-600"
                            style={{ MozAppearance: 'textfield' }}
                          />
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
            </div>
          </main>

          {/* 順位表パネル (ヘッダーへ移動しました) */}

          {/* 優勝モーダル */}
          <div
            className={`absolute inset-0 bg-slate-950/85 backdrop-blur-sm z-[1000] flex flex-col items-center justify-center transition-all duration-500 ${
              championPlayer ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'
            }`}
          >
            {championPlayer && (
              <div
                className={`flex flex-col items-center text-center p-8 max-w-lg transition-transform duration-500 delay-100 ${
                  championPlayer ? 'scale-100 translate-y-0' : 'scale-50 translate-y-12'
                }`}
              >
                <div className="text-8xl mb-4 animate-bounce">🏆</div>

                <h2 className="font-outfit font-black text-6xl tracking-wider text-yellow-400 drop-shadow-[0_5px_20px_rgba(250,204,21,0.5)] mb-2">
                  CHAMPION
                </h2>
                <p className="text-slate-400 text-xs font-bold tracking-widest uppercase mb-8">
                  {tournamentTitle} GRAND FINALS WINNER
                </p>

                <div className="flex gap-4 items-center justify-center bg-gradient-to-r from-yellow-950/40 via-yellow-900/50 to-yellow-950/40 border border-yellow-500/30 p-6 rounded-2xl mb-8 w-80 shadow-2xl">
                  {isImg(championPlayer.flag) ? (
                    <img src={championPlayer.flag} className="w-16 h-16 object-cover rounded-full bg-slate-800 border-2 border-yellow-500 shadow-[0_0_15px_rgba(250,204,21,0.5)]" alt="icon" />
                  ) : (
                    <span className="text-4xl">{championPlayer.flag}</span>
                  )}
                  <div className="text-left">
                    <span className="text-xs text-yellow-500 font-extrabold uppercase leading-none block mb-1">WINNER</span>
                    <span className="text-2xl font-outfit font-black text-white">{championPlayer.name}</span>
                  </div>
                </div>

                {!IS_DISPLAY && <div className="flex gap-3">
                  {!VIEWER && <button
                    onClick={() => initializeTournament(playerCount)}
                    className="bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-black px-6 py-3 rounded-xl transition shadow-lg shadow-yellow-500/20 flex items-center gap-2 cursor-pointer"
                  >
                    <RotateCcwIcon className="stroke-[3px]" />
                    もう一度プレイ
                  </button>}
                  <button
                    onClick={() => {
                      setChampionId(null);
                    }}
                    className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-6 py-3 rounded-xl border border-slate-700 transition cursor-pointer"
                  >
                    ブラケットを見る
                  </button>
                  <button
                    onClick={() => {
                      setChampionId(null);
                      setShowRanking(true);
                    }}
                    className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-6 py-3 rounded-xl border border-slate-700 transition cursor-pointer flex items-center gap-1.5"
                  >
                    🏅 順位表
                  </button>
                </div>}
              </div>
            )}
          </div>

          {/* フッター */}
          {!RO && (<footer className="mc-footer relative z-20 px-8 py-3 bg-slate-950/40 text-center border-t border-slate-900/60 backdrop-blur-sm flex justify-between items-center text-[10px] text-slate-500">
            <div>&copy; 2026 {tournamentTitle}. Tournament Bracket Maker.</div>
            <div className="flex gap-4">
              <span>ダブルクリックで選手名・アイコン変更 (1回戦のみ)</span>
              <span>&bull;</span>
              <span>ピンの下に名前を常時表示</span>
            </div>
          </footer>)}
        </div>
      );
    }

    async function boot() {
      if (/^https?:$/.test(location.protocol)) {
        try {
          const r = await fetch('api/state', { cache: 'no-store' });
          if (r.ok) { const j = await r.json(); if (j && typeof j === 'object' && 'rev' in j) { SERVER = true; REMOTE = j; } }
        } catch (e) { /* サーバーなし: ローカルモード */ }
      }
      if (SERVER) {
        if (!IS_DISPLAY) {
          try { TOKEN = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { TOKEN = ''; }
          if (TOKEN) {
            try {
              const r = await fetch('api/login', { method: 'POST', headers: { Authorization: 'Bearer ' + TOKEN } });
              ADMIN = r.ok;
              if (r.status === 401) { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
            } catch (e) { ADMIN = false; }
          }
        }
        VIEWER = !ADMIN;
        RO = IS_DISPLAY || VIEWER;
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }
    boot();
  </script>
</body>
</html>
