    // インライン SVG アイコン

    // 星空背景 (背景画像に星があるため、極小数を重ねてまたたかせる)
    function StarBackground() {
      const stars = useMemo(() => {
        const temp = [];
        for (let i = 0; i < 20; i++) {
          temp.push({
            id: i,
            x: Math.random() * 100,
            y: Math.random() * 100,
            size: Math.random() * 2 + 1,
            delay: Math.random() * 5
          });
        }
        return temp;
      }, []);

      return (
        <div className="absolute inset-0 pointer-events-none z-0">
          {stars.map((star) => (
            <div
              key={star.id}
              className="star"
              style={{
                left: `${star.x}%`,
                top: `${star.y}%`,
                width: `${star.size}px`,
                height: `${star.size}px`,
                animation: `twinkle 3s infinite ease-in-out`,
                animationDelay: `${star.delay}s`
              }}
            />
          ))}
        </div>
      );
    }

    const INPUT_CLS = 'w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-rose-500';
    function Field({ label, children }) {
      return (
        <div>
          <label className="block text-xs font-bold text-slate-400 mb-1.5 tracking-wide">{label}</label>

    }
    function Section({ title, children }) {
      return (
        <div className="border border-slate-800 p-3 space-y-3">

    }

    // =====================================================================
    //  ★ ゲーム追加ガイド
    //   1. THEMES に背景テーマを追加 (見た目を変えたい場合。CSSは styles.css に .xxx-theme を追加)
    //   2. GAME_PRESETS にゲーム用プリセットを追加 (タイトル/テーマ/得点ルール/ラベル/初期選手)
    //   ※ 設定パネルの「プリセット」→「現在の設定を保存」でも、コード不要で自分用プリセットを作れます
    // =====================================================================
    const THEMES = {
      earth:     { label: '地球 (Earth & Stars)',  rootClass: 'space-bg' },
      minecraft: { label: 'マインクラフト (Minecraft)', rootClass: 'mc-theme' },
      dark:      { label: 'ダーク (シンプル黒)',     rootClass: 'bg-slate-950' },
      blue:      { label: 'ブルーグラデーション',    rootClass: 'bg-gradient-to-br from-blue-950 to-slate-900' },
    };

    const DEFAULT_RULES = {
      pointsPerWin: 6000,     // 1勝あたりの得点
      hpMode: 'add',          // 敗退者の入力値(HP等): add=加算 / subtract=減算 / ignore=使わない
      rankOrder: 'desc',      // desc=数値が大きいほど上位 / asc=小さいほど上位
      tiebreak: 'score',      // 同成績の決め方: score=数値で決める / share=同順位 / seed=シード順
      scoreLabel: '総与ダメージ',
      hpLabel: '残りHP',
      rankView: 'list',       // list=リスト / podium=表彰台+リスト
      rankTopN: 0,            // 0=全員表示 / n=上位n位まで
      showScore: true,
      repechage: { enabled: false, from: 1, to: 1 },   // 敗者復活戦: 対象は「fromラウンド〜toラウンド」の敗退者
    };

    const GAME_PRESETS = {
      geoguessr: {
        name: 'ジオゲッサー', theme: 'earth',
        title: 'GEO GUESSR RPG杯', subtitle: 'Geoguessr Tournament Bracket',
        rules: { pointsPerWin: 6000, hpMode: 'add', scoreLabel: '総与ダメージ', hpLabel: '残りHP' },
        players: DEFAULT_PLAYERS.map(p => ({ name: p.name, flag: p.flag })),
      },
      godfield: {
        name: 'ゴッドフィールド', theme: 'earth',
        title: 'GOD FIELD 杯', subtitle: 'God Field Tournament Bracket',
        rules: { pointsPerWin: 100, hpMode: 'subtract', scoreLabel: '最終スコア', hpLabel: '残り数値' },
      },
      minecraft: {
        name: 'マインクラフト', theme: 'minecraft',
        title: 'MINECRAFT 大会', subtitle: 'Minecraft Tournament Bracket',
        rules: { pointsPerWin: 20, hpMode: 'add', scoreLabel: 'スコア', hpLabel: '残りハート', rankView: 'podium' },
        players: [
          ...['Steve', 'Alex', 'Creeper', 'Zombie', 'Skeleton', 'Enderman', 'Pig', 'Villager', 'Blaze', 'Slime', 'Cow', 'Chicken']
            .map(n => ({ name: n, flag: `mc/avatars/${n.toLowerCase()}.svg` })),
          { name: 'Sword', flag: '🗡️' }, { name: 'Pickaxe', flag: '⛏️' }, { name: 'Diamond', flag: '💎' }, { name: 'Archer', flag: '🏹' },
        ],
      },
      generic: {
        name: '汎用 (その他のゲーム)', theme: 'dark',
        title: 'TOURNAMENT', subtitle: 'Tournament Bracket',
        rules: { pointsPerWin: 1, hpMode: 'ignore', scoreLabel: '勝利数', hpLabel: 'スコア', tiebreak: 'share' },
      },
    };

    const mergeRules = (r) => ({ ...DEFAULT_RULES, ...(r || {}), repechage: { ...DEFAULT_RULES.repechage, ...((r && r.repechage) || {}) } });

    // ラウンド名 (r1: 1始まり)
    const roundName = (r1, total) => {
      if (r1 >= total) return '決勝';
      if (r1 === total - 1) return '準決勝';
      if (r1 === total - 2) return '準々決勝';
      return `${r1}回戦`;
    };

    // ---- 保存 (localStorage) ----
    const STORAGE_KEY = 'bracket-maker:v2';
    const PRESET_KEY = 'bracket-maker:user-presets';
    const LIVE_KEY = 'bracket-maker:live';
    // ---- 配信専用画面: ?display=1 (&bg=transparent|green) (&title=1) ----
    const URLP = new URLSearchParams(location.search);
    const IS_DISPLAY = URLP.get('display') === '1';
    // ---- 同期サーバー (server.js) 連携: 管理者(ADMIN)だけが編集でき、他の人(VIEWER)は閲覧専用 ----
    const TOKEN_KEY = 'bracket-maker:token';
    let SERVER = false, ADMIN = false, VIEWER = false, RO = IS_DISPLAY, TOKEN = '', REMOTE = null;
    const authHeaders = () => ({ 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN });
    const normBg = (d) => {
      const def = { type: 'theme', image: '', color: '#1e293b', fit: 'cover', dim: 35 };
      if (d && d.bg && typeof d.bg === 'object') return { ...def, ...d.bg };
      if (d && d.bgTheme === 'custom') return { ...def, type: d.customBgUrl ? 'image' : 'theme', image: d.customBgUrl || '' };
      return def;
    };
    const adminLogin = async () => {
      const pw = window.prompt('管理者パスワードを入力してください');
      if (!pw) return;
      try {
        const r = await fetch('api/login', { method: 'POST', headers: { Authorization: 'Bearer ' + pw } });
        if (r.ok) { try { localStorage.setItem(TOKEN_KEY, pw); } catch (e) {} location.reload(); }
        else window.alert(r.status === 429 ? '試行回数が多すぎます。1分ほど待ってください。' : 'パスワードが違います。');
      } catch (e) { window.alert('サーバーに接続できませんでした。'); }
    };
    const fileToBgData = (file, cb) => {
      const r = new FileReader();
      r.onload = (ev) => {
        if (/svg/.test(file.type)) { cb(ev.target.result); return; }
        const img = new Image();
        img.onload = () => {
          const sc = Math.min(1, 1920 / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          cb(c.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = () => window.alert('画像を読み込めませんでした。');
        img.src = ev.target.result;
      };
      r.readAsDataURL(file);
    };
    const DISPLAY_BG = ['transparent', 'green'].includes(URLP.get('bg')) ? URLP.get('bg') : 'theme';
    const DISPLAY_TITLE = URLP.get('title') === '1';
    const initLive = () => (SERVER ? (REMOTE && REMOTE.live) : loadJSON(LIVE_KEY)) || {};
    const loadJSON = (key) => { try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : null; } catch (e) { return null; } };
    const saveJSON = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; } };

    // ---- 敗者復活戦: エントリー順 → 全ラウンドの対戦を導出 (picks: {'r-m': 'a'|'b'}) ----
    function deriveRep(entrants, picks) {
      if (!entrants || entrants.length < 2) return { rounds: [], champion: null, wins: {} };
      const size = Math.pow(2, Math.ceil(Math.log2(entrants.length)));
      const order = getSeedOrder(size);
      let cur = order.map(s => (s < entrants.length ? entrants[s] : 'bye'));
      const rounds = [];
      const wins = {};
      let r = 0;
      while (cur.length > 1) {
        const ms = [];
        const next = [];
        for (let m = 0; m < cur.length / 2; m++) {
          const a = cur[m * 2], b = cur[m * 2 + 1];
          let w = null, auto = false;
          if (a === 'bye' && b === 'bye') { w = 'bye'; auto = true; }
          else if (a === 'bye') { w = b; auto = true; }
          else if (b === 'bye') { w = a; auto = true; }
          else {
            const pk = picks[`${r}-${m}`];
            if (pk === 'a' && a) w = a; else if (pk === 'b' && b) w = b;
            if (w) wins[w] = (wins[w] || 0) + 1;
          }
          ms.push({ a, b, w, auto });
          next.push(w);
        }
        rounds.push(ms);
        cur = next;
        r++;
      }
      const last = rounds[rounds.length - 1][0];
      return { rounds, champion: last.w && last.w !== 'bye' ? last.w : null, wins };
    }

    const PlayerIcon = ({ flag, size = 28 }) => (
      isImg(flag)
        ? <img src={flag} style={{ width: size, height: size, imageRendering: 'pixelated' }} className="object-cover bg-slate-800 shrink-0 rounded-full" alt="icon" />
        : <span style={{ fontSize: size * 0.85, lineHeight: 1 }} className="shrink-0">{flag || '📍'}</span>
    );

    // ---- 敗者復活戦ボード ----
    function RepBoard({ rep, derived, pmap, eligibleIds, stale, rules, totalRounds, onGenerate, onPick, onUndo }) {
      const from = rules.repechage.from, to = rules.repechage.to;
      const scopeText = from === to ? `${roundName(from, totalRounds)}敗退者` : `${roundName(from, totalRounds)}〜${roundName(to, totalRounds)}の敗退者`;
      const nm = (id) => pmap[id];
      const rows = (m, mi, ri) => ['a', 'b'].map(side => {
        const id = m[side];
        const isW = m.w && m.w === id;
        const canPick = m.a && m.b && m.a !== 'bye' && m.b !== 'bye' && !m.w;
        return (
          <div key={side} className={`flex items-center gap-2 px-2 py-1.5 border ${isW ? 'bg-emerald-900/60 border-emerald-500' : 'bg-slate-900/80 border-slate-700'} ${m.w && !isW && m.w !== 'bye' ? 'opacity-50' : ''}`}>
            {id === 'bye' ? <span className="text-slate-500 text-xs font-bold w-full text-center">BYE (不戦勝)</span>
              : id ? (<>
                <PlayerIcon flag={nm(id)?.flag} size={24} />
                <span className={`text-sm font-bold truncate flex-1 ${isW ? 'text-emerald-300' : 'text-white'}`}>{nm(id)?.name}</span>
                {canPick && !RO && <button onClick={() => onPick(ri, mi, side)} className="bg-rose-600 hover:bg-rose-500 text-white text-[10px] font-black px-2 py-0.5 rounded cursor-pointer">WIN</button>}
                {isW && <span className="text-emerald-400 text-xs">✔</span>}
              </>)
              : <span className="text-slate-600 text-xs w-full text-center">---</span>}
          </div>
        );
      });

      return (
        <div className="relative z-10 flex-1 overflow-auto p-6 md:p-10">
          <div className="max-w-6xl mx-auto bg-slate-950/85 border-2 border-slate-700 p-6">
            <div className="flex flex-wrap items-center gap-3 mb-6">
              <h2 className="text-2xl font-black font-outfit text-white">🔄 敗者復活戦</h2>
              <span className="text-xs text-slate-300 bg-slate-900/80 border border-slate-700 px-3 py-1 rounded">対象: {scopeText} / 現在 {eligibleIds.length} 名</span>
              {!RO && <button onClick={onGenerate} disabled={eligibleIds.length < 2}
                className="ml-auto bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white text-xs font-black px-4 py-2 rounded-lg cursor-pointer">
                {rep ? '対戦表を作り直す' : '対戦表を作成'}
              </button>}
            </div>
            {stale && rep && !RO && (
              <div className="mb-4 text-xs text-amber-300 bg-amber-950/70 border border-amber-700 px-3 py-2">
                本戦の結果が変わり、対象者が現在の対戦表と一致しません。「対戦表を作り直す」で更新できます (復活戦の勝敗はリセットされます)。
              </div>
            )}
            {!rep && (
              <div className="text-slate-300 text-sm bg-slate-900/70 border border-slate-700 p-6">

    function PixelArt({ rows, palette, size, className }) {
      const rects = [];
      rows.forEach((row, y) => {
        [...row].forEach((ch, x) => {
          if (palette[ch]) rects.push(<rect key={`${x}-${y}`} x={x} y={y} width="1" height="1" fill={palette[ch]} />);
        });
      });
      return (
        <svg className={className} viewBox={`0 0 ${rows[0].length} ${rows.length}`} width={rows[0].length * size} height={rows.length * size} shapeRendering="crispEdges">
          {rects}
        </svg>
      );
    }

    const getSeedOrder = (size) => {
      if (size <= 2) return [0, 1];
      const half = getSeedOrder(size / 2);
      const res = [];
      half.forEach(seed => {
        res.push(seed);
        res.push(size - 1 - seed);
      });
      return res;
    };

          } else {
            if (document.fullscreenElement && document.exitFullscreen) {
              await document.exitFullscreen();

        } catch (err) {
          console.warn("Fullscreen API failed", err);
        }
      };

      useEffect(() => {
        const handleFullscreenChange = () => {

            if (isPreviewMode) togglePreviewMode(false);
            else { setShowRanking(false); setShowSettings(false); }

        };
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        window.addEventListener('keydown', handleKeyDown);

          document.removeEventListener('fullscreenchange', handleFullscreenChange);
          window.removeEventListener('keydown', handleKeyDown);

      // 画面サイズ調整: ボード表示エリア(ヘッダー/フッターを除いた実寸)に全体が収まる倍率を計算

      const getMatchCenterCoordinates = (rIndex, mIndex) => {
        // 2回戦以降の縦線を短くするため、トーナメント全体の高さを圧縮
        const stepY = (baseH - 380) / numRounds;
        const y = baseH - 160 - rIndex * stepY;

        if (rIndex === 0) {
          // 1回戦の試合の中心X座標
          const numMatches = bracketSize / 2;
          const segmentW = baseW / numMatches;
          const x = segmentW * (mIndex + 0.5);
          return { x, y };
        } else {
          // 2回戦以降の試合の中心X座標は、前のラウンドの進出元2つの試合の中央になる
          const leftParent = getMatchCenterCoordinates(rIndex - 1, mIndex * 2);
          const rightParent = getMatchCenterCoordinates(rIndex - 1, mIndex * 2 + 1);
          const x = (leftParent.x + rightParent.x) / 2;
          return { x, y };
        }
      };

      // プレイヤーピンの配置座標 (垂直直線で完璧に繋がるように、進出元試合の中心座標とX座標を完全一致させる)
      const getPlayerCoords = (player) => {
        if (!player) return { x: 0, y: 0 };
        
        if (player.position.round === numRounds) {
          return championCoords;
        }

        const rIndex = player.position.round;
        const mIndex = player.position.match;
        const slot = player.position.slot;

        if (rIndex === 0) {
          // 1回戦：各試合の中心から offset 分だけ左右に配置し、さらに低く配置する
          const mCenter = getMatchCenterCoordinates(0, mIndex);
          const x = mCenter.x + (slot === 1 ? -uiConfig.offset : uiConfig.offset);
          return { x, y: mCenter.y + uiConfig.bridgeOffset * 1.8 };
        } else {
          // 2回戦以降：線の角（水平ブリッジの両端点）の真上に完璧に乗せる！
          const leftParent = getMatchCenterCoordinates(rIndex - 1, mIndex * 2);
          const rightParent = getMatchCenterCoordinates(rIndex - 1, mIndex * 2 + 1);
          const x = slot === 1 ? leftParent.x : rightParent.x;
          
          // Y座標は、そのラウンドの試合のブリッジの高さ (mCenter.y - bridgeOffset) と完全に一致させる！
          const currentMatchCenter = getMatchCenterCoordinates(rIndex, mIndex);
          return { x, y: currentMatchCenter.y - uiConfig.bridgeOffset };
        }
      };

      // 順位計算ロジック (ルールは大会設定 rules で変更可能)
      // 生存優先 > 勝利ラウンド数 > 敗者復活戦の勝ち数 > (設定により) スコア / 同順位 / シード順
      const winsMap = useMemo(() => {
        const map = {};
        players.forEach(p => { map[p.id] = 0; });
        matches.forEach(round => round.forEach(match => {
          if (match.winnerId) map[match.winnerId] = (map[match.winnerId] || 0) + 1;
        }));
        return map;
      }, [players, matches]);

      // 敗者復活戦の対象者 (fromラウンド〜toラウンドで敗退した選手)
      const repEligible = useMemo(() => {
        if (!rules.repechage.enabled) return [];
        return players.filter(p => {
          if (p.isBye || !p.isLoser || p.id === championId) return false;
          const lost = (winsMap[p.id] || 0) + 1;
          return lost >= rules.repechage.from && lost <= rules.repechage.to;
        });
      }, [players, winsMap, championId, rules.repechage]);

      const repDerived = useMemo(
        () => deriveRep(repechage ? repechage.entrants : [], repechage ? repechage.picks : {}),
        [repechage]
      );
      const repStale = useMemo(() => {
        if (!repechage) return false;
        const a = [...repechage.entrants].sort().join(',');
        const b = repEligible.map(p => p.id).sort().join(',');
        return a !== b;
      }, [repechage, repEligible]);

      const computeRankings = useMemo(() => {
        const allPlayers = players
          .filter(p => !p.isBye)
          .map((p, seedIdx) => {
            const wonRounds = winsMap[p.id] || 0;
            const hpVal = Number(playerHp[p.id]) || 0;
            let hpPart = 0;
            if (p.isLoser) hpPart = rules.hpMode === 'add' ? hpVal : rules.hpMode === 'subtract' ? -hpVal : 0;
            return {
              player: p,
              seedIdx,
              isAlive: p.id === championId || !p.isLoser,
              wonRounds,
              repWins: repDerived.wins[p.id] || 0,
              isRepChamp: repDerived.champion === p.id,
              totalDamage: wonRounds * rules.pointsPerWin + hpPart,
              hp: hpVal
            };
          });

        const useScore = rules.tiebreak === 'score';
        // 同順位決定戦: 「同成績」のグループ内で行われた試合の勝利数
        allPlayers.forEach(e => { e.baseKey = `${e.isAlive}|${e.wonRounds}|${e.repWins}|${useScore ? e.totalDamage : ''}`; e.poWins = 0; e.poVec = [0]; });
        const byId = Object.fromEntries(allPlayers.map(e => [e.player.id, e]));
        // ① 1対1の決定戦: 勝利数
        playoffs.forEach(m => {
          if (m.ids) return;
          const A = byId[m.a], B = byId[m.b];
          if (!A || !B || !m.w || A.baseKey !== B.baseKey) return;
          (m.w === 'a' ? A : B).poVec[0] += 1;
        });
        // ② 同時対戦の決定戦: 記録した順位 (1位ほど高得点)。作成順に、前の結果で同率だった者同士を区別していく
        playoffs.filter(m => m.ids).forEach(m => {
          const mem = m.ids.map(id => byId[id]);
          if (mem.some(x => !x) || new Set(mem.map(x => x.baseKey)).size !== 1) return;
          const n = mem.length;
          allPlayers.forEach(e => e.poVec.push(0));
          (m.order || []).forEach((id, k) => { byId[id].poVec[byId[id].poVec.length - 1] = n - 1 - k; });
        });
        allPlayers.forEach(e => { e.poWins = e.poVec.reduce((x, y) => x + y, 0); e.poKey = e.poVec.join(','); });
        const poCmp = (a, b) => {
          for (let i = 0; i < a.poVec.length; i++) if (a.poVec[i] !== b.poVec[i]) return b.poVec[i] - a.poVec[i];
          return 0;
        };
        allPlayers.sort((a, b) => {
          if (a.isAlive !== b.isAlive) return a.isAlive ? -1 : 1;
          if (b.wonRounds !== a.wonRounds) return b.wonRounds - a.wonRounds;
          if (b.repWins !== a.repWins) return b.repWins - a.repWins;
          if (useScore && a.totalDamage !== b.totalDamage) {
            return rules.rankOrder === 'asc' ? a.totalDamage - b.totalDamage : b.totalDamage - a.totalDamage;
          }
          const pc = poCmp(a, b); if (pc) return pc;
          return a.seedIdx - b.seedIdx;
        });

        let currentRank = 1;
        return allPlayers.map((entry, idx) => {
          if (idx > 0) {
            const prev = allPlayers[idx - 1];
            const same = prev.isAlive === entry.isAlive && prev.wonRounds === entry.wonRounds && prev.repWins === entry.repWins
              && rules.tiebreak !== 'seed' && (!useScore || prev.totalDamage === entry.totalDamage) && prev.poKey === entry.poKey;
            if (!same) currentRank = idx + 1;
          }
          return { rank: currentRank, ...entry };
        });
      }, [players, winsMap, playerHp, championId, rules, repDerived, playoffs]);

      // 同成績の選手グループ (決定戦の対象)
      const tieGroups = useMemo(() => {
        const g = {};
        computeRankings.forEach(e => { (g[e.baseKey] = g[e.baseKey] || []).push(e); });
        return Object.values(g).filter(a => a.length >= 2 && a.length <= 8 && !a[0].isAlive);
      }, [computeRankings]);
      const playoffCreate = (group) => {
        const ids = group.map(e => e.player.id);
        const has = (x, y) => playoffs.some(m => (m.a === x && m.b === y) || (m.a === y && m.b === x));
        const add = [];
        for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
          if (!has(ids[i], ids[j])) add.push({ id: `po-${Date.now()}-${i}-${j}`, a: ids[i], b: ids[j], w: null });
        }
        if (add.length) setPlayoffs(prev => [...prev, ...add]);
      };
      // 同時対戦: 同率のまま残っている選手(同じ決定戦成績)ごとにまとめる
      const playoffFfaCreate = (ids) => setPlayoffs(prev => [...prev, { id: `ff-${Date.now()}`, ids, order: [] }]);
      const playoffFfaToggle = (recId, pid) => setPlayoffs(prev => prev.map(m => {
        if (m.id !== recId) return m;
        let order = m.order.includes(pid) ? m.order.filter(x => x !== pid) : [...m.order, pid];
        const rest = m.ids.filter(x => !order.includes(x));
        if (rest.length === 1 && order.length === m.ids.length - 1) order = [...order, rest[0]];   // 残り1人は自動で最下位
        return { ...m, order };
      }));
      const playoffRemove = (recId) => setPlayoffs(prev => prev.filter(m => m.id !== recId));
      const playoffPick = (id, w) => setPlayoffs(prev => prev.map(m => m.id === id ? { ...m, w: m.w === w ? null : w } : m));
      const playoffClear = (group) => {
        const set = new Set(group.map(e => e.player.id));
        setPlayoffs(prev => prev.filter(m => m.ids ? !m.ids.every(x => set.has(x)) : !(set.has(m.a) && set.has(m.b))));
      };


      const handlePlayerUpdate = (id, newName, newFlag) => {
        setPlayers(prev => prev.map(p => p.id === id ? { ...p, name: newName, flag: newFlag } : p));
        setCustomNames(prev => ({ ...prev, [id]: newName }));
        setCustomFlags(prev => ({ ...prev, [id]: newFlag }));
      };

      // 残り体力を更新する
      const handleSetHp = (id, value) => {
        const parsed = value === '' ? null : Number(value);
        setPlayerHp(prev => ({ ...prev, [id]: parsed }));
      };

      // 順位に対応するラベルを返す
      const getRoundLabel = (lostRound) => {
        const total = Math.log2(bracketSize);
        if (lostRound >= total) return '🏆 優勝';
        if (lostRound === total - 1) return '準優勝';
        if (lostRound === total - 2) return '3位';
        return `TOP ${Math.pow(2, total - lostRound)}`;
      };

      // 大会設定画面で表示・編集するための、エントリー時の全プレイヤーリスト
      const entryPlayers = useMemo(() => {
        return Array.from({ length: playerCount }).map((_, i) => {
          const defaultName = (DEFAULT_PLAYERS[i] || {}).name || `Player ${i + 1}`;
          const customName = customNames[`p${i + 1}`];
          const customFlag = customFlags[`p${i + 1}`];
          return {
            id: `p${i + 1}`,
            name: customName !== undefined ? customName : defaultName,
            flag: customFlag !== undefined ? customFlag : ((DEFAULT_PLAYERS[i] || {}).flag || '📍')
          };
        });
      }, [playerCount, customNames, customFlags]);

      // トーナメント初期化
      const initializeTournament = (count, customList = null) => {
        setChampionId(null);
        
        const bSize = Math.max(4, Math.pow(2, Math.ceil(Math.log2(count))));
        const seedOrder = getSeedOrder(bSize);
        
        // customListが渡されていればそれを使う、なければデフォルトから生成
        let basePlayers = customList;
        if (!basePlayers) {
            basePlayers = [];
            for (let i = 0; i < count; i++) {
              const defaultData = DEFAULT_PLAYERS[i] || { name: `Player ${i+1}`, flag: '📍' };
              const customName = customNames[`p${i+1}`];
              const customFlag = customFlags[`p${i+1}`];
              basePlayers.push({
                  id: `p${i+1}`,
                  name: customName !== undefined ? customName : defaultData.name,
                  flag: customFlag !== undefined ? customFlag : defaultData.flag
              });
            }
        }

        const activePlayers = [];
        
        // seedOrderに基づいてスロットを埋める
        for (let i = 0; i < bSize; i++) {
            const seedRank = seedOrder[i];
            if (seedRank < count) {
                // プレイヤーが入る
                const p = basePlayers[seedRank];
                activePlayers.push({
                    id: p.id,
                    name: p.name,
                    flag: p.flag,
                    score: 0,
                    isWinner: false,
                    isLoser: false,
                    position: {
                        round: 0,
                        match: Math.floor(i / 2),
                        slot: (i % 2) + 1
                    }
                });
            } else {
                // Bye (シード枠のダミー)
                activePlayers.push({
                    id: `bye-${i}`,
                    name: "Bye",
                    flag: "",
                    isBye: true,
                    score: 0,
                    isWinner: false,
                    isLoser: true, 
                    position: {
                        round: 0,
                        match: Math.floor(i / 2),
                        slot: (i % 2) + 1
                    }
                });
            }
        }

        const rCount = Math.log2(bSize);
        const newMatches = [];

        for (let r = 0; r < rCount; r++) {
          const roundMatches = [];
          const numMatches = bSize / Math.pow(2, r + 1);
          for (let m = 0; m < numMatches; m++) {
            roundMatches.push({
              id: `${r}-${m}`,
              round: r,
              match: m,
              player1Id: r === 0 ? activePlayers[m * 2].id : null,
              player2Id: r === 0 ? activePlayers[m * 2 + 1].id : null,
              winnerId: null,
              isLocked: r !== 0
            });
          }
          newMatches.push(roundMatches);
        }
        
        // 自動でByeとの試合を解決する (不戦勝)
        newMatches[0].forEach((match, mIndex) => {
            const p1 = activePlayers.find(p => p.id === match.player1Id);
            const p2 = activePlayers.find(p => p.id === match.player2Id);
            
            if (p1 && p1.isBye && p2 && !p2.isBye) {
                match.winnerId = p2.id;
                p2.isWinner = true;
                p2.position = { round: 1, match: Math.floor(mIndex / 2), slot: (mIndex % 2) === 0 ? 1 : 2 };
            } else if (p2 && p2.isBye && p1 && !p1.isBye) {
                match.winnerId = p1.id;
                p1.isWinner = true;
                p1.position = { round: 1, match: Math.floor(mIndex / 2), slot: (mIndex % 2) === 0 ? 1 : 2 };
            }
        });
        
        // 次のラウンドにシード勝者を設定
        newMatches[0].forEach((match, mIndex) => {
            if (match.winnerId) {
                const nextMatch = newMatches[1][Math.floor(mIndex / 2)];
                if (mIndex % 2 === 0) nextMatch.player1Id = match.winnerId;
                else nextMatch.player2Id = match.winnerId;
                
                if (nextMatch.player1Id && nextMatch.player2Id) nextMatch.isLocked = false;
            }
        });

        // Byeも含めて全プレイヤーをステートに保存 (Byeを表示して山を完成させる)
        setPlayers(activePlayers);
        setMatches(newMatches);
      };

      // 選手をシャッフルする処理
      const handleShuffle = () => {
        setChampionId(null);

        const shuffled = [...entryPlayers].sort(() => 0.5 - Math.random());
        
        const newCustomNames = {};
        const newCustomFlags = {};
        shuffled.forEach((p, idx) => {
          newCustomNames[`p${idx+1}`] = p.name;
          newCustomFlags[`p${idx+1}`] = p.flag;
        });
        setCustomNames(newCustomNames);
        setCustomFlags(newCustomFlags);

        initializeTournament(playerCount, shuffled.map((p, i) => ({ ...p, id: `p${i+1}` })));
      };

      useEffect(() => {
        if (skipInit.current) { skipInit.current = false; return; }
        setRepechage(null);
        setPlayoffs([]);
        initializeTournament(playerCount);
      }, [playerCount]);

      const handleSetWinner = (roundIndex, matchIndex, winnerKey) => {
        const nextMatches = [...matches];
        const match = { ...nextMatches[roundIndex][matchIndex] };
        
        const p1Id = match.player1Id;
        const p2Id = match.player2Id;
        if (!p1Id || !p2Id) return;

        const winnerId = winnerKey === 'player1' ? p1Id : p2Id;
        const loserId = winnerKey === 'player1' ? p2Id : p1Id;

        // もしすでに以前勝者が設定されていた場合は、その勝者の進出先の情報を再帰クリアする
        if (match.winnerId && match.winnerId !== winnerId) {
          clearUpperRounds(nextMatches, roundIndex + 1, Math.floor(matchIndex / 2), match.winnerId);
        }

        match.winnerId = winnerId;
        nextMatches[roundIndex][matchIndex] = match;

        setPlayers(prevPlayers => {
          return prevPlayers.map(p => {
            if (p.id === winnerId) {
              const isFinalRound = roundIndex === nextMatches.length - 1;
              const nextRound = roundIndex + 1;
              const nextMatch = Math.floor(matchIndex / 2);
              const nextSlot = (matchIndex % 2 === 0) ? 1 : 2;

              return {
                ...p,
                isWinner: true,
                isLoser: false, // 勝者は敗退状態ではない
                position: isFinalRound
                  ? { round: nextRound, match: 0, slot: 0 }
                  : { round: nextRound, match: nextMatch, slot: nextSlot }
              };
            }
            if (p.id === loserId) {
              return {
                ...p,
                isWinner: false,
                isLoser: true
              };
            }
            return p;
          });
        });

        const isFinalRound = roundIndex === nextMatches.length - 1;

        if (isFinalRound) {
          setMatches(nextMatches);
          setChampionId(winnerId);
          triggerChampionEffects();
        } else {
          const nextRoundIndex = roundIndex + 1;
          const nextMatchIndex = Math.floor(matchIndex / 2);
          const nextMatch = { ...nextMatches[nextRoundIndex][nextMatchIndex] };

          const isP1Slot = matchIndex % 2 === 0;
          if (isP1Slot) {
            nextMatch.player1Id = winnerId;
          } else {
            nextMatch.player2Id = winnerId;
          }

          if (nextMatch.player1Id && nextMatch.player2Id) {
            nextMatch.isLocked = false;
          }

          nextMatches[nextRoundIndex][nextMatchIndex] = nextMatch;
          setMatches(nextMatches);
        }
      };

      // 決定した勝利を取り消して、再度WINボタンを表示できるようにする処理（間違い修正用）
      const handleUndoWinner = (roundIndex, matchIndex) => {
        const nextMatches = [...matches];
        const match = { ...nextMatches[roundIndex][matchIndex] };
        const prevWinnerId = match.winnerId;

        if (!prevWinnerId) return;

        match.winnerId = null;
        nextMatches[roundIndex][matchIndex] = match;

        setPlayers(prevPlayers => {
          const p1Id = match.player1Id;
          const p2Id = match.player2Id;

          return prevPlayers.map(p => {
            if (p.id === prevWinnerId) {
              // 以前の勝者をこのラウンドの配置位置に戻す
              return {
                ...p,
                isWinner: false,
                position: {
                  round: roundIndex,
                  match: matchIndex,
                  slot: p.id === p1Id ? 1 : 2
                }
              };
            }
            if (p.id === p1Id || p.id === p2Id) {
              // 敗者状態を解除する
              return {
                ...p,
                isLoser: false
              };
            }
            return p;
          });
        });

        // 上位に進出している対象プレイヤー情報を再帰的にクリア
        if (roundIndex < nextMatches.length - 1) {
          clearUpperRounds(nextMatches, roundIndex + 1, Math.floor(matchIndex / 2), prevWinnerId);
        } else {
          setChampionId(null);
        }

        setMatches(nextMatches);
      };

      // 上位に進出してしまっている勝者IDを再帰的に空にするヘルパー
      const clearUpperRounds = (matchesArray, rIndex, mIndex, targetPlayerId) => {
        if (rIndex >= matchesArray.length) return;

        const match = { ...matchesArray[rIndex][mIndex] };
        let changed = false;

        if (match.player1Id === targetPlayerId) {
          match.player1Id = null;
          match.isLocked = true;
          changed = true;
        } else if (match.player2Id === targetPlayerId) {
          match.player2Id = null;
          match.isLocked = true;
          changed = true;
        }

        const prevWinnerId = match.winnerId;
        if (prevWinnerId === targetPlayerId) {
          match.winnerId = null;
          changed = true;
        }

        if (changed) {
          matchesArray[rIndex][mIndex] = match;
          // さらに対象プレイヤーの敗者状態も、上のラウンドで敗退していた場合に備えて解除する
          setPlayers(prev => prev.map(p => p.id === targetPlayerId ? { ...p, isLoser: false, isWinner: false } : p));

          if (rIndex < matchesArray.length - 1) {
            clearUpperRounds(matchesArray, rIndex + 1, Math.floor(mIndex / 2), targetPlayerId);
          } else {
            setChampionId(null);
          }
        }
      };

      const triggerChampionEffects = () => {
        const duration = 6 * 1000;
        const end = Date.now() + duration;

        const frame = () => {
          confetti({
            particleCount: 6,
            angle: 60,
            spread: 55,
            origin: { x: 0, y: 0.8 },
            colors: ['#fbbf24', '#f59e0b', '#3b82f6', '#ef4444', '#10b981']
          });
          confetti({
            particleCount: 6,
            angle: 120,
            spread: 55,
            origin: { x: 1, y: 0.8 },
            colors: ['#fbbf24', '#f59e0b', '#3b82f6', '#ef4444', '#10b981']
          });

          if (Date.now() < end) {
            requestAnimationFrame(frame);
          }
        };
        frame();
      };

      // PIXTAの見本画像と全く同一の、無駄な曲がりのない完璧な対称形トーナメント線を描画
      // 角は丸くしつつ、接合部分 of 白丸ポッチを防ぐために一筆書きパスとLinejoinを活用。一段目の棒（垂直線）は省略。
      const renderRoads = () => {
        const paths = [];

        matches.forEach((round, rIndex) => {
          const isFinalRound = rIndex === matches.length - 1;

          round.forEach((match, mIndex) => {
            // 現在の試合の中心座標
            const mCenter = getMatchCenterCoordinates(rIndex, mIndex);
            
            // プレイヤー1とプレイヤー2 of X座標 (前の対戦の中心と完全に重なっている)
            let p1X, p2X;
            if (rIndex === 0) {
              p1X = mCenter.x - uiConfig.offset;
              p2X = mCenter.x + uiConfig.offset;
            } else {
              const leftParent = getMatchCenterCoordinates(rIndex - 1, mIndex * 2);
              const rightParent = getMatchCenterCoordinates(rIndex - 1, mIndex * 2 + 1);
              p1X = leftParent.x;
              p2X = rightParent.x;
            }

            const active = match.winnerId !== null;

            // 水平ブリッジのY座標 (ピンの上端より少し上の位置)
            const bridgeY = mCenter.y - uiConfig.bridgeOffset;

            // 次の対戦のY座標、またはチャンピオンのY座標まで垂直に伸びる。
            // 【重要】進出したプレイヤーピンの配置Y座標(線の角)まで白い光の線を伸ばすため、次のラウンドのブリッジの高さ(nextMatchCenter.y - bridgeOffset)まで完全に伸ばします。
            const nextY = isFinalRound 
              ? championCoords.y 
              : getMatchCenterCoordinates(rIndex + 1, Math.floor(mIndex / 2)).y - uiConfig.bridgeOffset;

            // アクティブな進路（勝者が決まり、進出したルート）の判定
            const isP1Active = active && match.winnerId === match.player1Id;
            const isP2Active = active && match.winnerId === match.player2Id;

            if (rIndex === 0) {
              const pinY = mCenter.y + uiConfig.bridgeOffset * 1.8;
              // 1回戦の基本パス (ピンから上にブリッジまで上がり、中央に寄って、上に伸びる)
              const leftRoutePath = `M ${p1X} ${pinY} L ${p1X} ${mCenter.y} L ${mCenter.x} ${mCenter.y} L ${mCenter.x} ${nextY}`;
              const rightRoutePath = `M ${p2X} ${pinY} L ${p2X} ${mCenter.y} L ${mCenter.x} ${mCenter.y} L ${mCenter.x} ${nextY}`;
              
              // グレー背景線用（重ねないための右半分: ピンから上に上がり中央まで）
              const rightHorizontalOnly = `M ${p2X} ${pinY} L ${p2X} ${mCenter.y} L ${mCenter.x} ${mCenter.y}`;

              paths.push(
                <g key={`road-${rIndex}-${mIndex}`}>
                  {/* グレー背景線（左＋垂直） */}
                  <path
                    d={leftRoutePath}
                    stroke="rgba(255, 255, 255, 0.15)"
                    strokeWidth="16"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    fill="none"
                  />
                  {/* グレー背景線（右） */}
                  <path
                    d={rightHorizontalOnly}
                    stroke="rgba(255, 255, 255, 0.15)"
                    strokeWidth="16"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    fill="none"
                  />
                  {/* アクティブな白光り線（進出した場合のみ重ねる） */}
                  {isP1Active && (
                    <path
                      d={leftRoutePath}
                      stroke="#ffffff"
                      strokeWidth="16"
                      strokeLinecap="round"
                      strokeLinejoin="round"
                      fill="none"
                      style={{
                        filter: 'drop-shadow(0 0 10px rgba(255, 255, 255, 1))',
                        transition: 'stroke 0.4s, filter 0.4s'
                      }}
                    />
                  )}
                  {isP2Active && (
                    <path
                      d={rightRoutePath}
                      stroke="#ffffff"
                      strokeWidth="16"
                      strokeLinecap="round"
                      strokeLinejoin="round"
                      fill="none"
                      style={{
                        filter: 'drop-shadow(0 0 10px rgba(255, 255, 255, 1))',
                        transition: 'stroke 0.4s, filter 0.4s'
                      }}
                    />
                  )}
                </g>
              );
            } else {
              // 2回戦以降の基本パス
              const leftRoutePath = `M ${p1X} ${bridgeY} L ${mCenter.x} ${bridgeY} L ${mCenter.x} ${nextY}`;
              const rightRoutePath = `M ${p2X} ${bridgeY} L ${mCenter.x} ${bridgeY} L ${mCenter.x} ${nextY}`;
              
              // グレー背景線用（重ねないための右半分）
              const rightHorizontalOnly = `M ${p2X} ${bridgeY} L ${mCenter.x} ${bridgeY}`;

              paths.push(
                <g key={`road-${rIndex}-${mIndex}`}>
                  {/* グレー背景線（左＋垂直） */}
                  <path
                    d={leftRoutePath}
                    stroke="rgba(255, 255, 255, 0.15)"
                    strokeWidth="16"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    fill="none"
                  />
                  {/* グレー背景線（右） */}
                  <path
                    d={rightHorizontalOnly}
                    stroke="rgba(255, 255, 255, 0.15)"
                    strokeWidth="16"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    fill="none"
                  />
                  {/* アクティブな白光り線（進出した場合のみ重ねる） */}
                  {isP1Active && (
                    <path
                      d={leftRoutePath}
                      stroke="#ffffff"
                      strokeWidth="16"
                      strokeLinecap="round"
                      strokeLinejoin="round"
                      fill="none"
                      style={{
                        filter: 'drop-shadow(0 0 10px rgba(255, 255, 255, 1))',
                        transition: 'stroke 0.4s, filter 0.4s'
                      }}
                    />
                  )}
                  {isP2Active && (
                    <path
                      d={rightRoutePath}
                      stroke="#ffffff"
                      strokeWidth="16"
                      strokeLinecap="round"
                      strokeLinejoin="round"
                      fill="none"
                      style={{
                        filter: 'drop-shadow(0 0 10px rgba(255, 255, 255, 1))',
                        transition: 'stroke 0.4s, filter 0.4s'
                      }}
                    />
                  )}
                </g>
              );
            }
          });
        });

        return (
          <svg className="bracket-svg absolute inset-0 w-full h-full pointer-events-none z-10">
            {paths}
          </svg>
        );
      };

      useEffect(() => { document.title = `${tournamentTitle || 'Tournament'} - Bracket`; }, [tournamentTitle]);

      const pmap = useMemo(() => Object.fromEntries(players.map(p => [p.id, p])), [players]);
      const repRoundOptions = useMemo(() => Array.from({ length: Math.max(0, numRounds - 1) }, (_, i) => i + 1), [numRounds]);
      const podiumEntries = rules.rankView === 'podium' ? computeRankings.slice(0, 3) : [];
      const listEntries = (rules.rankView === 'podium' ? computeRankings.slice(3) : computeRankings)
        .filter(e => !rules.rankTopN || e.rank <= rules.rankTopN);

      // ---------- 敗者復活戦の操作 ----------
      const handleRepGenerate = () => {
        if (repEligible.length < 2) return;
        setRepechage({ entrants: repEligible.map(p => p.id), picks: {} });
      };
      const clearDownstream = (picks, r, m) => {
        const next = { ...picks };
        let rr = r + 1, mm = m >> 1;
        while (rr < repDerived.rounds.length) { delete next[`${rr}-${mm}`]; rr++; mm >>= 1; }
        return next;
      };
      const handleRepPick = (r, m, side) => {
        setRepechage(prev => prev && ({ ...prev, picks: { ...clearDownstream(prev.picks, r, m), [`${r}-${m}`]: side } }));
      };
      const handleRepUndo = (r, m) => {
        setRepechage(prev => {
          if (!prev) return prev;
          const next = clearDownstream(prev.picks, r, m);
          delete next[`${r}-${m}`];
          return { ...prev, picks: next };
        });
      };

      // ---------- プリセット ----------
      const buildPlayerList = (src) => Array.from({ length: 32 }, (_, i) => (src && src[i]) ? { name: src[i].name, flag: src[i].flag } : { name: `Player ${i + 1}`, flag: '📍' });
      const applyPresetData = (p) => {
        setRules(mergeRules(p.rules));
        setBgTheme(p.theme || 'dark');
        setTournamentTitle(p.title || 'TOURNAMENT');
        setTournamentSubtitle(p.subtitle || '');
        const list = buildPlayerList(p.players);
        const names = {}, flags = {};
        list.forEach((x, i) => { names[`p${i + 1}`] = x.name; flags[`p${i + 1}`] = x.flag; });
        setCustomNames(names);
        setCustomFlags(flags);
        setPlayerHp({});
        setRepechage(null);
        setPlayoffs([]);
        setView('main');
        initializeTournament(playerCount, list.slice(0, playerCount).map((x, i) => ({ id: `p${i + 1}`, ...x })));
      };
      const handleApplyPreset = () => {
        const p = presetChoice.startsWith('user:')
          ? userPresets.find(u => u.id === presetChoice.slice(5))
          : GAME_PRESETS[presetChoice];
        if (!p) return;
        if (!window.confirm(`プリセット「${p.name}」を適用します。現在のトーナメント進行はリセットされます。よろしいですか?`)) return;
        applyPresetData(p);
      };
      const handleSavePreset = () => {
        const name = window.prompt('プリセット名を入力してください (例: ○○ゲーム大会)', tournamentTitle);
        if (!name) return;
        const preset = {
          id: String(Date.now()), name, theme: bgTheme === 'custom' ? 'dark' : bgTheme,
          title: tournamentTitle, subtitle: tournamentSubtitle, rules,
          players: entryPlayers.map(p => ({ name: p.name, flag: p.flag })),
        };
        const next = [...userPresets, preset];
        setUserPresets(next);
        saveJSON(PRESET_KEY, next);
        setPresetChoice(`user:${preset.id}`);
      };
      const handleDeletePreset = () => {
        if (!presetChoice.startsWith('user:')) return;
        const id = presetChoice.slice(5);
        const next = userPresets.filter(u => u.id !== id);
        setUserPresets(next);
        saveJSON(PRESET_KEY, next);
        setPresetChoice('geoguessr');
      };

      // ---------- 保存 / 書き出し / 読み込み ----------
      const snapshot = () => ({
        kind: 'bracket-maker-save', version: 2,
        playerCount, players, matches, championId, customNames, customFlags, playerHp,
        tournamentTitle, tournamentSubtitle, bgTheme, bg, rules, repechage, playoffs,
      });

      useEffect(() => {
        if (!matches.length || RO) return;
        const ok = saveJSON(STORAGE_KEY, snapshot());
        setSaveState(ok ? 'saved' : 'error');
      }, [playerCount, players, matches, championId, customNames, customFlags, playerHp, tournamentTitle, tournamentSubtitle, bgTheme, bg, rules, repechage, playoffs]);

      // 管理者 → サーバーへ送信 (観戦者へリアルタイム配信される)
      useEffect(() => {
        if (!ADMIN || !matches.length) return;
        const t = setTimeout(async () => {
          try {
            const r = await fetch('api/state', {
              method: 'POST', headers: authHeaders(),
              body: JSON.stringify({ state: snapshot(), live: { showRanking: liveMirror && showRanking, view: liveMirror ? view : 'main' } }),
            });
            setSyncState(r.ok ? 'ok' : r.status === 401 ? 'auth' : 'err');
          } catch (e) { setSyncState('err'); }
        }, 250);
        return () => clearTimeout(t);
      }, [playerCount, players, matches, championId, customNames, customFlags, playerHp, tournamentTitle, tournamentSubtitle, bgTheme, bg, rules, repechage, playoffs, showRanking, view, liveMirror]);

      const applySaved = (d, keepView) => {
        if (d.playerCount !== playerCount) skipInit.current = true;
        setPlayerCount(d.playerCount || 8);
        setPlayers(d.players || []);
        setMatches(d.matches || []);
        setChampionId(d.championId || null);
        setCustomNames(d.customNames || {});
        setCustomFlags(d.customFlags || {});
        setPlayerHp(d.playerHp || {});
        setTournamentTitle(d.tournamentTitle || 'TOURNAMENT');
        setTournamentSubtitle(d.tournamentSubtitle || '');
        setBgTheme(THEMES[d.bgTheme] ? d.bgTheme : 'dark');
        setBg(normBg(d));
        setRules(mergeRules(d.rules));
        setRepechage(d.repechage || null);
        setPlayoffs(d.playoffs || []);
        if (!keepView) setView('main');
      };
      // ---------- 配信連動 ----------
      const matchesRef = useRef(matches); matchesRef.current = matches;
      const champRef = useRef(championId); champRef.current = championId;

      // 操作画面 → 順位表/復活戦タブの表示状態を配信画面へ送る
      useEffect(() => {
        if (RO || SERVER) return;
        saveJSON(LIVE_KEY, { showRanking: liveMirror && showRanking, view: liveMirror ? view : 'main', t: Date.now() });
      }, [showRanking, view, liveMirror]);

      // サーバー/他タブからの更新を反映 (配信画面・観戦者)
      const receiveRemote = (d) => {
        if (!d || d.kind !== 'bracket-maker-save' || !Array.isArray(d.matches)) return;
        // 新しく決まった勝者を検出して速報バナーを出す
        const prev = matchesRef.current;
        let found = null;
        d.matches.forEach((round, r) => round.forEach((m, i) => {
          const old = prev[r] && prev[r][i];
          const isBye = String(m.player1Id).startsWith('bye-') || String(m.player2Id).startsWith('bye-');
          if (m.winnerId && !isBye && (!old || old.winnerId !== m.winnerId)) found = { r, id: m.winnerId };
        }));
        if (found && found.r < d.matches.length - 1) {
          const p = (d.players || []).find(x => x.id === found.id);
          if (p) {
            const total = d.matches.length;
            clearTimeout(announceTimer.current);
            setAnnounce({ key: Date.now(), name: p.name, flag: p.flag, sub: `${roundName(found.r + 1, total)} 勝利 → ${roundName(found.r + 2, total)}へ進出` });
            announceTimer.current = setTimeout(() => setAnnounce(null), 5500);
          }
        }
        const champChanged = (d.championId || null) !== lastRemoteChamp.current;
        if (d.championId && champChanged) triggerChampionEffects();
        lastRemoteChamp.current = d.championId || null;
        // 観戦者が優勝画面を閉じたあと、他の更新で再び開かないようにする
        applySaved(champChanged || IS_DISPLAY ? d : { ...d, championId: champRef.current }, true);
        setSynced(true);
      };
      const receiveRef = useRef(null); receiveRef.current = receiveRemote;

      // 配信画面 ← 同一ブラウザの操作画面 (サーバーなしのとき)
      useEffect(() => {
        if (!IS_DISPLAY || SERVER) return;
        const onStorage = (e) => {
          if (e.key === LIVE_KEY && e.newValue) {
            try { const l = JSON.parse(e.newValue); setShowRanking(!!l.showRanking); setView(l.view || 'main'); } catch (err) {}
            return;
          }
          if (e.key !== STORAGE_KEY || !e.newValue) return;
          let d;
          try { d = JSON.parse(e.newValue); } catch (err) { return; }
          receiveRef.current(d);
        };
        window.addEventListener('storage', onStorage);
        return () => window.removeEventListener('storage', onStorage);
      }, []);

      // 観戦者・配信画面 ← サーバー (リアルタイム)
      useEffect(() => {
        if (!SERVER || !RO) return;
        let es, dead = false;
        const open = () => {
          es = new EventSource('api/stream');
          es.onmessage = (ev) => {
            let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
            setSyncState('ok');
            if (m.state) receiveRef.current(m.state);
            if (IS_DISPLAY && m.live) { setShowRanking(!!m.live.showRanking); setView(m.live.view || 'main'); }
          };
          es.onerror = () => { setSyncState('err'); };
        };
        open();
        return () => { dead = true; if (es) es.close(); };
      }, []);

      // 透過/グリーンバック背景 (OBS用)
      useEffect(() => {
        if (!IS_DISPLAY || DISPLAY_BG === 'theme') return;
        document.body.classList.remove('space-bg');
        const c = DISPLAY_BG === 'green' ? '#00ff00' : 'transparent';
        document.body.style.background = c;
        document.documentElement.style.background = c;
      }, []);

      const displayUrl = (() => {
        const base = location.href.split('#')[0].split('?')[0];
        const q = ['display=1'];
        if (liveBg !== 'theme') q.push(`bg=${liveBg}`);
        if (liveTitle) q.push('title=1');
        return `${base}?${q.join('&')}`;
      })();
      const handleCopyUrl = async () => {
        try { await navigator.clipboard.writeText(displayUrl); }
        catch (e) {
          const t = document.getElementById('live-url');
          if (t) { t.select(); document.execCommand('copy'); }
        }
        setCopied(true); setTimeout(() => setCopied(false), 1800);
      };
      const handleOpenDisplay = () => window.open(displayUrl, 'bracket-display', 'width=1280,height=720');

      const handleExport = () => {
        const blob = new Blob([JSON.stringify(snapshot(), null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${(tournamentTitle || 'tournament').replace(/[^\w぀-鿿-]+/g, '_')}.json`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      };
      const handleImport = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const d = JSON.parse(ev.target.result);
            if (d.kind !== 'bracket-maker-save' || !Array.isArray(d.matches)) throw new Error('format');
            applySaved(d);
          } catch (e) { window.alert('読み込みに失敗しました。このサイトで書き出したJSONファイルを選んでください。'); }
        };
        reader.readAsText(file);
      };
      const handleBulkNames = () => {
        const lines = bulkText.split(/\r?\n/).map(s => s.trim()).filter(Boolean).slice(0, 32);
        if (lines.length < 3) { window.alert('3人以上の名前を1行ずつ入力してください。'); return; }
        const names = { ...customNames };
        lines.forEach((n, i) => { names[`p${i + 1}`] = n; });
        const flags = { ...customFlags };
        lines.forEach((n, i) => { if (flags[`p${i + 1}`] === undefined) flags[`p${i + 1}`] = (DEFAULT_PLAYERS[i] || {}).flag || '📍'; });
        setCustomNames(names);
        setCustomFlags(flags);
        const list = lines.map((n, i) => ({ id: `p${i + 1}`, name: n, flag: flags[`p${i + 1}`] }));
        if (lines.length === playerCount) {
          initializeTournament(lines.length, list);
        } else {
          skipInit.current = false;
          setPlayerCount(lines.length);   // 人数変更でトーナメントが再生成される
        }
        setBulkText('');
      };

      // 同順位決定戦カード (順位表・トーナメント画面の両方で使う)
      const renderPlayoffCards = () => tieGroups.map(group => {
                      const ids = new Set(group.map(e => e.player.id));
                      const ms = playoffs.filter(m => !m.ids && ids.has(m.a) && ids.has(m.b));
                      const ffs = playoffs.filter(m => m.ids && m.ids.every(x => ids.has(x)));
                      if (RO && ms.length === 0 && ffs.length === 0) return null;
                      const nm = (id) => (pmap[id] || {}).name || '?';
                      const need = group.length * (group.length - 1) / 2 - ms.length;
                      // 決定戦の成績がまだ同じ選手のまとまり (同時対戦の対象)
                      const open = Object.values(group.reduce((acc, e) => { (acc[e.poKey] = acc[e.poKey] || []).push(e.player.id); return acc; }, {})).filter(a => a.length >= 2);
                      const openNow = open.filter(a => !ffs.some(f => f.order.length < f.ids.length && f.ids.length === a.length && f.ids.every(x => a.includes(x))));
                      return (
                        <div key={group.map(e => e.player.id).join('-')} className="po-card border-2 border-amber-500/60 bg-amber-950/20 p-4 rounded-2xl">
                          <div className="font-black text-amber-300 text-lg">⚔ 同順位決定戦 <span className="text-sm text-amber-200/80 font-bold">{group.map(e => e.player.name).join(' / ')} (#{group[0].rank} タイ)</span></div>

                          {ffs.map((f, fi) => (
                            <div key={f.id} className="mt-3 border border-amber-500/40 p-3 bg-slate-950/40">
                              <div className="flex items-center justify-between mb-2">
                                <div className="text-xs font-black text-amber-200">🎮 同時対戦 {fi + 1} ({f.ids.length}人)</div>
                                {!RO && <button onClick={() => playoffRemove(f.id)} className="text-[10px] text-slate-400 hover:text-red-400 cursor-pointer">✕ 削除</button>}
                              </div>
                              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                {f.ids.map(id => {
                                  const pos = f.order.indexOf(id);
                                  return (
                                    <button key={id} disabled={RO} onClick={() => playoffFfaToggle(f.id, id)}
                                      className={`px-2 py-2 text-sm font-black border-2 ${RO ? '' : 'cursor-pointer'} ${pos >= 0 ? 'bg-emerald-700 border-emerald-300 text-white' : 'bg-slate-800 border-slate-600 hover:border-amber-400 text-white'}`}>
                                      <div className="text-[11px] text-amber-200">{pos >= 0 ? `${pos + 1}位` : '未入力'}</div>
                                      {nm(id)}
                                    </button>
                                  );
                                })}
                              </div>
                              {!RO && <div className="text-[10px] text-slate-400 mt-2">上位の人から順に押して、同時対戦での順位を記録します(もう一度押すと取り消し)。残り1人は自動で最下位になります。</div>}
                            </div>
                          ))}

                          {ms.length > 0 && (
                            <div className="mt-3 space-y-2">
                              <div className="text-xs font-black text-amber-200">⚔ 1対1の決定戦</div>
                              {ms.map(m => (
                                <div key={m.id} className="flex items-center gap-2 text-white">
                                  {['a', 'b'].map((side, i) => (
                                    <React.Fragment key={side}>
                                      {i === 1 && <span className="text-slate-500 text-xs font-black">VS</span>}
                                      <button disabled={RO} onClick={() => playoffPick(m.id, side)}
                                        className={`flex-1 px-3 py-2 text-sm font-black border-2 ${RO ? '' : 'cursor-pointer'} ${m.w === side ? 'bg-emerald-600 border-emerald-300 text-white' : m.w ? 'bg-slate-900/60 border-slate-700 text-slate-500 line-through' : 'bg-slate-800 border-slate-600 hover:border-amber-400'}`}>
                                        {m.w === side ? '🏆 ' : ''}{nm(m[side])}
                                      </button>
                                    </React.Fragment>
                                  ))}
                                </div>
                              ))}
                            </div>
                          )}

                          {!RO && (
                            <div className="mt-3 flex gap-2 flex-wrap">
                              {openNow.map(a => (
                                <button key={a.join(',')} onClick={() => playoffFfaCreate(a)} className="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-black px-3 py-1.5 cursor-pointer">🎮 {a.length}人で同時に対戦して順位を記録</button>
                              ))}
                              {need > 0 && <button onClick={() => playoffCreate(group)} className="bg-slate-800 hover:bg-slate-700 border border-amber-500/60 text-amber-200 text-xs font-black px-3 py-1.5 cursor-pointer">{ms.length ? '1対1: 不足分を追加' : '1対1の総当たりにする'}</button>}
                              {(ms.length > 0 || ffs.length > 0) && <button onClick={() => playoffClear(group)} className="bg-slate-800 hover:bg-red-900 border border-slate-700 text-xs px-3 py-1.5 cursor-pointer">決定戦をやめる</button>}
                            </div>
                          )}
                          {!RO && <div className="text-[10px] text-slate-400 mt-2">同時対戦で順位が付けば、その順に確定します。同率のまま残った人たちには、もう一度同時対戦を追加できます。</div>}
                        </div>
                      );
                    });

      const showBgDeco = !(IS_DISPLAY && DISPLAY_BG !== 'theme');
      const customBg = showBgDeco && bg.type !== 'theme';
      const rootBgStyle = (() => {
        if (IS_DISPLAY && DISPLAY_BG !== 'theme') return { backgroundImage: 'none', backgroundColor: DISPLAY_BG === 'green' ? '#00ff00' : 'transparent', background: DISPLAY_BG === 'green' ? '#00ff00' : 'transparent' };
        if (bg.type === 'color') return { background: bg.color };
        if (bg.type === 'image' && bg.image) {
          const tile = bg.fit === 'tile';
          return { backgroundColor: '#0f172a', backgroundImage: `url(${bg.image})`, backgroundSize: tile ? '128px 128px' : bg.fit, backgroundPosition: 'center', backgroundRepeat: tile ? 'repeat' : 'no-repeat', imageRendering: tile ? 'pixelated' : undefined };
        }
        if (bg.type === 'image') return { background: '#0f172a' };
        return undefined;
      })();
      if (VIEWER && !synced) {
        return (
